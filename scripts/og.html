<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem de compartilhamento do FINAGRO (1200x630)</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; background: var(--verde-900); color: #fff; overflow: hidden; isolation: isolate; display: grid; grid-template-columns: 560px 1fr; align-items: center; padding: 0 0 0 64px; box-sizing: border-box; }
  .og::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(70% 70% at 88% 20%, rgb(27 122 75 / 0.6), transparent 70%); }
  .og .sulcos { right: -10%; bottom: -30%; width: 1500px; }
  .og .sulcos path { stroke-dasharray: none; stroke-dashoffset: 0; animation: none; }
  .og img.marca { height: 54px; width: auto; margin-bottom: 30px; }
  .og h1 { font-size: 58px; line-height: 1.02; margin: 0 0 18px; font-weight: 800; }
  .og h1 em { font-style: normal; color: #b9e5c9; }
  .og p { font-size: 25px; line-height: 1.3; color: rgb(255 255 255 / 0.88); margin: 0; }
  .og .selo { display: inline-block; margin-top: 26px; background: #fff; color: var(--verde-900); border: 0; font-size: 22px; font-weight: 750; padding: 10px 20px; border-radius: 999px; }
  .og .aparelhos { width: 540px; margin-left: 0; padding-right: 12%; padding-bottom: 4%; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<div class="og">
  <svg class="sulcos" viewBox="0 0 1200 760" aria-hidden="true"><path d="M-60 760C220 470 560 330 1260 300"/><path d="M-60 650C230 380 560 250 1260 215"/><path d="M-60 540C240 300 570 170 1260 130"/><path d="M-60 430C250 220 580 95 1260 45"/></svg>
  <div>
    <img class="marca" src="/assets/marca/finagro-branco.webp" alt="FINAGRO">
    <h1>Gestão rural que começa pelo <em>que você produz</em></h1>
    <p>Rebanho, lavoura, contas e fluxo de caixa no celular e no computador.</p>
    <span class="selo">Grátis até 1.000 animais</span>
  </div>
  <div class="aparelhos">
    <div class="notebook"><div class="notebook__tampa"><div class="notebook__tela"><img src="/assets/telas/computador-painel.webp" alt=""></div></div><div class="notebook__base"></div></div>
    <div class="celular celular--claro"><div class="celular__ilha"></div><div class="celular__tela"><img src="/assets/telas/perfil-leite.webp" alt=""></div></div>
  </div>
</div>
</body>
</html>
