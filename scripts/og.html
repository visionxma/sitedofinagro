<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem de compartilhamento do FINAGRO (1200x630)</title>
<!-- Fotografada em 1200x630 (scripts/og: Chrome sem janela) e salva em assets/og/finagro-og.png. Mesma hero da página:
     o campo do vídeo ao fundo, o título à esquerda e o celular na moldura do Galaxy S26 Ultra com a tela real. -->
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d2418; }
  .og { position: relative; isolation: isolate; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 300px; align-items: center; gap: 48px; padding: 40px 80px 40px 72px; box-sizing: border-box; color: #fff; background: #0d2418; }
  .og__fundo { position: absolute; inset: 0; z-index: -1; }
  .og__fundo img { width: 100%; height: 100%; object-fit: cover; }
  .og__fundo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(8 24 15 / .9) 0%, rgb(8 24 15 / .66) 45%, rgb(8 24 15 / .3) 75%, rgb(8 24 15 / .45) 100%), linear-gradient(180deg, rgb(8 24 15 / .4), transparent 30%, transparent 70%, rgb(8 24 15 / .55)); }
  .og__marca img { height: 56px; width: auto; border-radius: 10px; }
  .og h1 { margin: 28px 0 16px; font: 800 66px/1.02 var(--f-titulo); letter-spacing: -.03em; }
  .og h1 span { color: #f3c14b; }
  .og p { margin: 0; font: 400 26px/1.35 var(--f-texto); color: rgb(255 255 255 / .9); max-width: 620px; }
  .og__selo { display: inline-block; margin-top: 26px; padding: 10px 20px; border-radius: 999px; background: #176b42; color: #fff; font: 650 22px/1 var(--f-titulo); }
  .og .celular { width: 270px; justify-self: center; }
</style>
</head>
<body>
<div class="og">
  <div class="og__fundo"><img src="/assets/heroi/capa-1920.webp" alt=""></div>
  <div>
    <div class="og__marca"><img src="/assets/marca/finagro-placa-400.webp" alt="FINAGRO"></div>
    <h1>Sua fazenda na <span>palma da mão</span></h1>
    <p>Rebanho, dinheiro, tarefas e o mapa da fazenda num app só, até sem sinal.</p>
    <span class="og__selo">Grátis no plano Campo</span>
  </div>
  <div class="celular">
    <span class="celular__botao celular__botao--volume"></span><span class="celular__botao celular__botao--liga"></span>
    <div class="celular__corpo"><div class="celular__tela">
      <div class="celular__status"><span class="celular__hora"></span><span></span></div>
      <div class="celular__app"><img src="/assets/telas/inicio-824.webp" alt=""></div>
      <div class="celular__gestos"></div>
    </div><span class="celular__camera"></span></div>
  </div>
</div>
</body>
</html>
